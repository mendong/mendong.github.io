name: Update PR Stats

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 UTC 00:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch PR stats via GraphQL
        env:
          GH_TOKEN: ${{ secrets.PR_STATS_TOKEN }}
        run: |
          WEEKS=8
          python3 << 'PYEOF'
          import subprocess, json, datetime

          weeks = 8
          now = datetime.date.today()

          fields = []
          for i in range(weeks):
              end = now - datetime.timedelta(days=i * 7)
              start = now - datetime.timedelta(days=(i + 1) * 7 - 1)
              q = f'author:mendong type:pr is:merged merged:{start}..{end}'
              fields.append(f'w{i}: search(query: "{q}", type: ISSUE) {{ issueCount }}')

          query = 'query { ' + ' '.join(fields) + ' }'

          result = subprocess.run(
              ['gh', 'api', 'graphql', '-f', f'query={query}'],
              capture_output=True, text=True
          )
          data = json.loads(result.stdout)['data']

          entries = []
          for i in range(weeks):
              start = now - datetime.timedelta(days=(i + 1) * 7 - 1)
              entries.append({
                  'label': f'{start.month}/{start.day:02d}',
                  'count': data[f'w{i}']['issueCount']
              })
          entries.reverse()

          output = {
              'updated': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'weeks': entries
          }
          with open('pr-stats.json', 'w') as f:
              json.dump(output, f)
          PYEOF

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pr-stats.json
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: Update PR stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
